<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px sans-serif; fill: #34495e; }
      .label { font: 14px sans-serif; fill: #2c3e50; }
      .small-label { font: 12px sans-serif; fill: #7f8c8d; }
      .box { stroke: #34495e; stroke-width: 2; fill: #fff; }
      .server-box { stroke: #2E5C8A; stroke-width: 3; fill: #4A90E2; }
      .source-box { stroke: #27AE60; stroke-width: 2; fill: #2ECC71; }
      .client-box { stroke: #E67E22; stroke-width: 2; fill: #F39C12; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-srt { stroke: #4A90E2; stroke-width: 3; fill: none; marker-end: url(#arrowhead-srt); }
      .group-bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; rx: 10; }
      .text-white { fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
    <marker id="arrowhead-srt" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90E2" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">SRT Stream Server Architecture</text>

  <!-- Input Sources Section -->
  <rect x="50" y="80" width="250" height="200" class="group-bg"/>
  <text x="175" y="105" text-anchor="middle" class="subtitle">📹 Input Sources</text>
  
  <rect x="70" y="120" width="100" height="50" class="source-box" rx="5"/>
  <text x="120" y="150" text-anchor="middle" class="label text-white">Camera</text>
  
  <rect x="180" y="120" width="100" height="50" class="source-box" rx="5"/>
  <text x="230" y="150" text-anchor="middle" class="label text-white">Video File</text>
  
  <rect x="70" y="180" width="100" height="50" class="source-box" rx="5"/>
  <text x="120" y="210" text-anchor="middle" class="label text-white">Screen</text>
  
  <rect x="180" y="180" width="100" height="50" class="source-box" rx="5"/>
  <text x="230" y="210" text-anchor="middle" class="label text-white">OBS Studio</text>

  <!-- FFmpeg Encoder -->
  <rect x="360" y="140" width="140" height="80" class="box" rx="5"/>
  <text x="430" y="170" text-anchor="middle" class="subtitle">FFmpeg</text>
  <text x="430" y="190" text-anchor="middle" class="small-label">Encoder</text>
  <text x="430" y="205" text-anchor="middle" class="small-label">H.264/H.265</text>

  <!-- Arrows from sources to FFmpeg -->
  <path d="M 170 145 L 360 170" class="arrow"/>
  <path d="M 230 145 L 360 175" class="arrow"/>
  <path d="M 170 205 L 360 185" class="arrow"/>
  <path d="M 230 205 L 360 190" class="arrow"/>

  <!-- SRT Stream Server Section -->
  <rect x="560" y="80" width="280" height="480" class="group-bg"/>
  <text x="700" y="105" text-anchor="middle" class="subtitle">🖥️ SRT Stream Server</text>
  
  <!-- Server Components -->
  <rect x="580" y="120" width="240" height="60" class="server-box" rx="5"/>
  <text x="700" y="145" text-anchor="middle" class="label text-white">SRT Listener</text>
  <text x="700" y="165" text-anchor="middle" class="small-label text-white">UDP Port 9000</text>

  <rect x="580" y="200" width="240" height="50" class="server-box" rx="5"/>
  <text x="700" y="230" text-anchor="middle" class="label text-white">Stream Manager</text>

  <rect x="580" y="270" width="240" height="50" class="server-box" rx="5"/>
  <text x="700" y="300" text-anchor="middle" class="label text-white">Connection Handler</text>

  <rect x="580" y="340" width="240" height="50" class="server-box" rx="5"/>
  <text x="700" y="370" text-anchor="middle" class="label text-white">Packet Buffer</text>

  <rect x="580" y="410" width="240" height="50" class="server-box" rx="5"/>
  <text x="700" y="435" text-anchor="middle" class="label text-white">Encryption (AES)</text>

  <rect x="580" y="480" width="240" height="60" class="server-box" rx="5"/>
  <text x="700" y="510" text-anchor="middle" class="label text-white">Stream Relay</text>

  <!-- SRT Arrow from FFmpeg to Server -->
  <path d="M 500 180 L 580 145" class="arrow-srt"/>
  <text x="540" y="155" class="small-label" fill="#4A90E2">SRT Stream</text>
  <text x="540" y="170" class="small-label" fill="#4A90E2">MPEG-TS</text>

  <!-- Internal Server Arrows -->
  <path d="M 700 180 L 700 200" class="arrow"/>
  <path d="M 700 250 L 700 270" class="arrow"/>
  <path d="M 700 320 L 700 340" class="arrow"/>
  <path d="M 700 390 L 700 410" class="arrow"/>
  <path d="M 700 460 L 700 480" class="arrow"/>

  <!-- Clients Section -->
  <rect x="900" y="80" width="250" height="480" class="group-bg"/>
  <text x="1025" y="105" text-anchor="middle" class="subtitle">📺 Viewers</text>

  <rect x="920" y="140" width="100" height="50" class="client-box" rx="5"/>
  <text x="970" y="170" text-anchor="middle" class="label text-white">FFplay</text>

  <rect x="1030" y="140" width="100" height="50" class="client-box" rx="5"/>
  <text x="1080" y="170" text-anchor="middle" class="label text-white">VLC</text>

  <rect x="920" y="210" width="100" height="50" class="client-box" rx="5"/>
  <text x="970" y="240" text-anchor="middle" class="label text-white">mpv</text>

  <rect x="1030" y="210" width="100" height="50" class="client-box" rx="5"/>
  <text x="1080" y="240" text-anchor="middle" class="label text-white">Web Player</text>

  <rect x="920" y="280" width="100" height="50" class="client-box" rx="5"/>
  <text x="970" y="310" text-anchor="middle" class="label text-white">Mobile</text>

  <rect x="1030" y="280" width="100" height="50" class="client-box" rx="5"/>
  <text x="1080" y="310" text-anchor="middle" class="label text-white">Smart TV</text>

  <!-- Arrows from Server to Clients -->
  <path d="M 820 510 L 920 165" class="arrow-srt"/>
  <path d="M 820 510 L 1030 165" class="arrow-srt"/>
  <path d="M 820 510 L 920 235" class="arrow-srt"/>
  <path d="M 820 510 L 1030 235" class="arrow-srt"/>
  <path d="M 820 510 L 920 305" class="arrow-srt"/>
  <path d="M 820 510 L 1030 305" class="arrow-srt"/>

  <!-- Stats Section -->
  <rect x="50" y="600" width="1100" height="150" class="group-bg"/>
  <text x="600" y="630" text-anchor="middle" class="subtitle">⚡ Key Features</text>

  <text x="200" y="665" text-anchor="middle" class="label">🔒 AES Encryption</text>
  <text x="400" y="665" text-anchor="middle" class="label">📦 Packet Recovery</text>
  <text x="600" y="665" text-anchor="middle" class="label">⏱️ 120-200ms Latency</text>
  <text x="800" y="665" text-anchor="middle" class="label">🌐 NAT Traversal</text>
  <text x="1000" y="665" text-anchor="middle" class="label">📊 Adaptive Bitrate</text>

  <text x="200" y="700" text-anchor="middle" class="small-label">Secure transmission</text>
  <text x="400" y="700" text-anchor="middle" class="small-label">Lost packet detection</text>
  <text x="600" y="700" text-anchor="middle" class="small-label">Ultra-low latency</text>
  <text x="800" y="700" text-anchor="middle" class="small-label">Firewall-friendly</text>
  <text x="1000" y="700" text-anchor="middle" class="small-label">Network resilience</text>

  <text x="600" y="730" text-anchor="middle" class="small-label" fill="#7f8c8d">
    Transport: UDP | Format: MPEG-TS | Protocol: SRT v1.4+
  </text>
</svg>
